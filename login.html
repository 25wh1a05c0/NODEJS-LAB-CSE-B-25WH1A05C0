<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body style="margin:0; background-color:blue; font-family:'Times New Roman', Times, serif; padding:20px;">
    <header style="background-color:lightgreen; display:flex; align-items:center; padding:20px;">
        <div>
            <img src= "college logo.png"
                 alt="College Logo"
                 style="width:100px; height:120px;">
        </div>
        <div style="flex:1; text-align:center;">
            <h1 style="margin:0; color:black;">
                BVRIT HYDERABAD College of Engineering for Women <br>
                Bachupally, Hyderabad, Telangana, 500090 <br><br>
                Welcome to the E-Book Management System
            </h1>
        </div>
    </header>
    <br>
    <hr>
    <footer style="background-color:orange; text-align:center; padding:15px;">
        <nav style="font-size:24px;">
            <a href="login.html" style="color:black; margin:0 10px;">Login</a> |
            <a href="register.html" style="color:black; margin:0 10px;">Register</a> |
            <a href="catalog.html" style="color:black; margin:0 10px;">Catalog</a> |
            <a href="cart.html" style="color:black; margin:0 10px;">Cart</a>
        </nav>
    </footer>
    <hr>
    <br><br>
    <div style="background-color:lightblue; width:40%; margin:auto; padding:30px; text-align:center; border-radius:10px;">
        <h2>Login Form</h2>
        <form action="login.html" method="post">
            <label><b>Username:</b></label>
            <input type="text" id="username" name="username" required>
            <br><br>
            <label><b>Password:</b></label>
            <input type="password" id="password" name="password" required>
            <br><br>
            <input type="submit" value="Login" style="padding:8px 20px; font-size:18px;">
            &nbsp;&nbsp;
            <input type="reset" value="Reset" style="padding:8px 20px; font-size:18px;">
        </form>
    </div>
    <br><br>
    <hr>
    <div style="text-align:center; margin-top:20px; background-color:blueviolet; padding:20px; font-size:24px;">
        <h3>
            For further assistance, please contact our support team at
            <a href="mailto:info@bvrithyderabad.edu.in" style="color:black;">
                info@bvrithyderabad.edu.in
            </a>
        </h3>
    </div>
