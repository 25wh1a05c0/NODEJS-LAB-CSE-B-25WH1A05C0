<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - E-Book Management System</title>
</head>
<body style="margin:0; background-color:blue; font-family:'Times New Roman', Times, serif; padding:20px; color:black;">
<header style="background-color:lightgreen; display:flex; align-items:center; padding:20px;">
    <div>
        <img src="college logo.png" alt="College Logo" style="width:100px; height:120px;">
    </div>
    <div style="flex:1; text-align:center;">
        <h1 style="margin:0; color:black; font-size:2rem;">
            BVRIT HYDERABAD College of Engineering for Women <br>
            Bachupally, Hyderabad, Telangana, 500090 <br><br>
            E-Book Management System - Registration
        </h1>
    </div>
</header>
<br>
<hr>
<br>
<div style="background-color:lightblue; width:70%; margin:auto; padding:25px; border-radius:10px; color:black;">
    <h2 style="text-align:center; color:black;">Registration Form</h2>
    <form id="registerform">
        <label for="Name"><b>Name:</b></label>
        <input type="text" id="Name" name="Name" placeholder="Enter Name" required>
        <br><br>
        <label for="password"><b>Password:</b></label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required>
        <br><br>
        <label for="email"><b>Email:</b></label>
        <input type="email" id="email" name="email" placeholder="Enter Email" required>
        <br><br>
        <label for="phone"><b>Phone:</b></label>
        <input type="tel" id="phone" name="phone" placeholder="Enter Phone Number" required>
        <br><br>
        <label for="age"><b>Age:</b></label>
        <input type="number" id="age" name="age" placeholder="Enter Age" required>
        <br><br>
        <label for="DOB"><b>Date of Birth:</b></label>
        <input type="date" id="DOB" name="DOB" required>
        <br><br>
        <label><b>Gender:</b></label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>
        <label for="Address"><b>Address:</b></label><br>
        <textarea id="Address" name="Address" rows="4" cols="50"></textarea>
        <br><br>
        <center>
            <input type="submit" value="Register" style="padding:8px 20px; font-size:18px;">
            &nbsp;&nbsp;
            <input type="reset" value="Reset" style="padding:8px 20px; font-size:18px;">
        </center>
    </form>
</div>
<br>
<hr>
<div style="text-align:center; margin-top:20px; background-color:blueviolet; padding:20px; font-size:24px;">
    <h3 style="color:black;">
        For further assistance, please contact our support team at
        <a href="mailto:info@bvrithyderabad.edu.in" style="color:black;">
            info@bvrithyderabad.edu.in
        </a>
    </h3>
</div>
<script src="register-script.js"></script>
</body>
</html>
