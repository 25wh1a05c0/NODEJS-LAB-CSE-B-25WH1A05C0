<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - E-Book Management System</title>
</head>
<body style="margin:0; background-color:blue; font-family:'Times New Roman', Times, serif; padding:20px; color:black;">
<header style="background-color:lightgreen; display:flex; align-items:center; padding:20px;">
    <div>
        <img src="college logo.png" alt="College Logo" style="width:100px; height:120px;">
    </div>
    <div style="flex:1; text-align:center;">
        <h1 style="margin:0; color:black; font-size:2rem;">
            BVRIT HYDERABAD College of Engineering for Women <br>
            Bachupally, Hyderabad, Telangana, 500090 <br><br>
            Welcome to the E-Book Management System
        </h1>
    </div>
</header>
<br>
<hr>
<br><br>
<div style="background-color:lightblue; width:40%; margin:auto; padding:30px; text-align:center; border-radius:10px; color:black;">
    <h2 style="color:black;">Login Form</h2>
    <form id="loginform">
        <label for="username"><b>Username:</b></label>
        <input type="text" id="username" name="username" placeholder="Enter Username" required>
        <br><br>
        <label for="password"><b>Password:</b></label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required>
        <br><br>
        <input type="submit" value="Login" style="padding:8px 20px; font-size:18px;">
        &nbsp;&nbsp;
        <input type="reset" value="Reset" style="padding:8px 20px; font-size:18px;">
    </form>
</div>
<br><br>
<hr>
<div style="text-align:center; margin-top:20px; background-color:blueviolet; padding:20px; font-size:24px;">
    <h3 style="color:black;">
        For further assistance, please contact our support team at
        <a href="mailto:info@bvrithyderabad.edu.in" style="color:black;">
            info@bvrithyderabad.edu.in
        </a>
    </h3>
</div>
<script src="script.js"></script>
</body>
</html>
